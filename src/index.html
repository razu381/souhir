<!doctype html>

<head>

<!-- Dev-only comparison index: not a shipped section, so it carries its own
     tiny style block instead of a components.css entry. Everything else is
     the system's own classes. -->
<style>
  .sf-index { min-height: 100vh; display: grid; align-content: center; }
  .sf-index__list { margin: clamp(2.5rem, 7vh, 5rem) 0 0; padding: 0; list-style: none; border-bottom: 1px solid var(--hairline); }
  .sf-index__row { border-top: 1px solid var(--hairline); }
  .sf-index__link {
    display: flex; align-items: baseline; justify-content: space-between; gap: 1.5rem;
    padding-block: clamp(1.25rem, 3vh, 2rem);
    text-decoration: none; color: inherit;
    font-family: var(--font-display); font-weight: 400;
    font-size: clamp(1.5rem, 2.6vw, 2.5rem); line-height: 1.1; letter-spacing: -.02em;
    transition: transform var(--dur-micro) var(--ease);
  }
  .sf-index__link:hover, .sf-index__link:focus-visible { transform: translateX(.375rem); }
  .sf-index__note {
    font-family: var(--font-sans); font-size: var(--t-label); font-weight: 500;
    letter-spacing: var(--track-label); text-transform: uppercase;
    color: var(--graphite); text-align: right;
  }
  .sf-index__note em { font-style: normal; color: var(--bronze); }
  @media (max-width: 767px) { .sf-index__link { flex-direction: column; gap: .5rem; } .sf-index__note { text-align: left; } }
</style>
</head>
<body>

<main>
<section class="sf-section sf-section--paper sf-index">

    </div>

    <ul class="sf-index__list">
      <li class="sf-index__row">
        <a class="sf-index__link" href="./hero-threshold.html">
          The Spread
          <span class="sf-index__note">paper &middot; the double-page print &middot; <em>05: the rail</em></span>
        </a>
      </li>
      <li class="sf-index__row">
        <a class="sf-index__link" href="./hero-exhibition.html">
          The Exhibition
          <span class="sf-index__note">noir gallery &middot; Fig. plates &middot; <em>05: the signature</em></span>
        </a>
      </li>
      <li class="sf-index__row">
        <a class="sf-index__link" href="./hero-overture.html">
          The Overture

      </li>
      <li class="sf-index__row">
        <a class="sf-index__link" href="./hero-nocturne.html">
          The Nocturne
          <span class="sf-index__note">umber gallery &middot; lamplight &middot; <em>05: the signature</em></span>

      </li>
    </ul>

  </div>
</section>
