# Dar SF — Next.js 16 + Sanity v6. The repo root IS the app.
#
# Netlify (Site configuration):
#   • Base directory: (none) — the app lives at the repo root. If the site was
#     previously configured with base directory `web`, clear that setting.
#   • Environment variables required:
#       NEXT_PUBLIC_SANITY_PROJECT_ID / NEXT_PUBLIC_SANITY_DATASET  (public)
#       SANITY_REVALIDATE_SECRET   — shared with the GROQ publish webhook
#       SANITY_API_WRITE_TOKEN     — create-messages-only role, for the forms
#       NEXT_PUBLIC_SITE_URL       — the final domain, for metadata/sitemap
#   • Sanity GROQ webhook → POST /api/revalidate with the header
#     `x-sanity-webhook-secret: <the same secret>`.

[build]
  command = "npm run build"
  publish = ".next"
